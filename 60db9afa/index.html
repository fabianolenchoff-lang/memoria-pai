<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Em memória de Carlos Lenchoff Neto e Thereza Farias Lenchoff</title>
<style>
  :root {
    --bg: #faf8f5;
    --text: #2e2b27;
    --muted: #6b665e;
    --accent: #8a7355;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: Georgia, 'Times New Roman', serif;
    line-height: 1.6;
  }
  main {
    max-width: 640px;
    margin: 0 auto;
    padding: 32px 20px 64px;
  }
  h1 {
    font-size: 28px;
    text-align: center;
    margin: 16px 0 4px;
    font-weight: 500;
  }
  .datas {
    text-align: center;
    color: var(--muted);
    font-size: 16px;
    margin: 0 0 28px;
  }
  .video {
    width: 100%;
    border-radius: 8px;
    overflow: hidden;
    margin-bottom: 28px;
    background: #000;
  }
  video {
    width: 100%;
    display: block;
  }
  .texto {
    font-size: 17px;
    margin-bottom: 32px;
    white-space: pre-line;
  }
  footer {
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    margin-top: 48px;
  }
</style>
</head>
<body>
<main>
  <h1>Carlos Lenchoff Neto<br>Thereza Farias Lenchoff</h1>

  <div class="video">
    <video controls playsinline preload="metadata" poster="capa.jpg">
      <source src="video_final.mp4" type="video/mp4">
      Seu navegador não suporta vídeo. <a href="video_final.mp4">Baixe o vídeo aqui</a>.
    </video>
  </div>

  <p class="texto">Saudades eternas, nos vemos na próxima encarnação. Ou não??!!?</p>

  <footer>Com amor, da família.</footer>
</main>
</body>
</html>
